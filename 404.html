<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2ee" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | TeoCode</title>

    <!-- Caminhos começam com "/" porque esta página é servida em qualquer endereço inexistente. -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />

    <script data-goatcounter="https://teocode.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Syne:wght@800&display=swap"
        rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: #f4f2ee; color: #0a0e1a; color-scheme: light; }
        body {
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
            font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        }
        .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
        .brand img { display: block; border-radius: 50%; box-shadow: 0 3px 14px rgba(91, 200, 200, 0.55); }
        .brand span { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.01em; }
        h1 {
            margin-top: 48px;
            font-family: "Syne", sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.06;
            letter-spacing: -0.03em;
            text-wrap: balance;
        }
        p { margin-top: 20px; max-width: 44ch; font-size: 1.1rem; line-height: 1.6; color: rgba(10, 14, 26, 0.75); }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
        .button {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 12px 24px;
            font-weight: 600;
            color: #0a0e1a;
            text-decoration: none;
        }
        .button-primary { background: #00c9a7; }
        .button-quiet { border-color: rgba(10, 14, 26, 0.25); }
        a:focus-visible { outline: 3px solid #0a0e1a; outline-offset: 3px; }
    </style>
</head>

<body>
    <a class="brand" href="/">
        <img src="/assets/logo.svg" width="42" height="42" alt="" />
        <span>TeoCode</span>
    </a>

    <main>
        <h1>Página não encontrada</h1>
        <p>O endereço que você abriu não existe ou mudou de lugar. Volte ao início ou fale com a gente pelo WhatsApp.</p>
        <div class="actions">
            <a class="button button-primary" href="/">Voltar ao início</a>
            <a class="button button-quiet" target="_blank" rel="noopener noreferrer" data-gc-event="cta-404"
                href="https://wa.me/5511926377723?text=Ol%C3%A1!%20Abri%20um%20link%20do%20site%20da%20TeoCode%20que%20n%C3%A3o%20funcionou%20e%20gostaria%20de%20ajuda.">Falar no WhatsApp</a>
        </div>
    </main>

    <script>
        document.querySelector('[data-gc-event]').addEventListener('click', function () {
            var name = this.getAttribute('data-gc-event');
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({ path: name, title: name, event: true });
            }
        });
    </script>
</body>

</html>
