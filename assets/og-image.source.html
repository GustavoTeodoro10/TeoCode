<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>TeoCode - imagem de compartilhamento (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Syne:wght@800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0a0e1a; overflow: hidden; }
  body {
    position: relative;
    font-family: "Hanken Grotesk", sans-serif;
    color: #f4f2ee;
    background:
      radial-gradient(60% 70% at 85% 30%, rgba(0, 201, 167, 0.14), transparent 70%),
      radial-gradient(45% 55% at 5% 100%, rgba(61, 127, 255, 0.10), transparent 70%),
      #0a0e1a;
  }
  .brand { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 3px 14px rgba(91, 200, 200, 0.55); }
  .brand span { font-family: "Syne", sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.01em; color: #fff; }
  h1 {
    position: absolute; left: 80px; bottom: 150px;
    font-family: "Syne", sans-serif; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.035em;
  }
  p { position: absolute; left: 80px; bottom: 76px; font-size: 32px; color: rgba(244, 242, 238, 0.75); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #00c9a7; }
</style>
</head>
<body>
  <div class="brand"><img src="logo.svg" alt="" /><span>TeoCode</span></div>
  <h1>Transforme<br />seu negócio.</h1>
  <p>Sites personalizados e agentes de IA no WhatsApp. Mauá, SP.</p>
  <div class="bar"></div>
</body>
</html>
